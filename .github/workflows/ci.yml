name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Check formatting
        run: just fmt-check

  hooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Fetch the shared hook config
        run: lefthook install
      - name: Assert the merged config
        run: |
          dump=$(lefthook dump)
          for job in core-fmt core-forbidden-files core-policy owner-signing; do
            grep -q "name: $job" <<<"$dump" || {
              echo "::error::the shared hook config did not load job $job"
              exit 1
            }
          done
      - name: Validate hook config
        run: lefthook validate

  lint:
    uses: simpsonm09-projects/repo-standard/.github/workflows/lint.yml@301bf82b937f8d6a09da73e9a22030bce2acd2e1 # repo-standard, pinned commit
  aislop:
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-projects/repo-standard/.github/workflows/aislop.yml@301bf82b937f8d6a09da73e9a22030bce2acd2e1 # repo-standard, pinned commit
  security:
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-projects/repo-standard/.github/workflows/security.yml@301bf82b937f8d6a09da73e9a22030bce2acd2e1 # repo-standard, pinned commit
  standard:
    permissions:
      contents: read
    uses: simpsonm09-projects/repo-standard/.github/workflows/standard.yml@301bf82b937f8d6a09da73e9a22030bce2acd2e1 # repo-standard, pinned commit

  # Required. The manifest verifier is the fast gate; the installer suite moves
  # to the `portable` workflow on main and weekly.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Validate the workspace manifests
        run: just validate

  # Required. The fast Node tests. The POSIX installer fixture lifecycle runs on
  # Linux in the `portable` workflow.
  test-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Lint the JavaScript
        run: just lint
      - name: Node tests
        run: mise exec -- node --test scripts/ordinal-guard.test.mjs scripts/generate-layers.test.mjs scripts/verify-manifests.test.mjs scripts/verify-pi-harness.test.mjs
