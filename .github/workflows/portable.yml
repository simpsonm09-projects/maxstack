name: portable

# The installer fixture suite is slow and does not diff, so it runs on `main`,
# weekly and on demand instead of on the required pull request path. Every job
# runs on Linux (C5.6). See the owner standard C5.4.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Verify PowerShell 7
        run: pwsh --version
      - name: Print runner tools
        run: |
          node --version
          python3 --version
          git --version
      - name: Run the POSIX installer fixture lifecycle
        run: just test-linux
