# Tools for maxstack. Versions match the owner standard's pinning table.
# See https://github.com/simpsonm09-projects/repo-standard/blob/main/docs/linting.md

[tools]

# Task runner
"aqua:casey/just" = "1.59.0"

# Git hooks and secret scanning
"aqua:evilmartians/lefthook" = "2.2.2"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:koalaman/shellcheck" = "0.11.0"

# CI linters
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.30.1"

# JavaScript toolchain. Bun formats and lints the .mjs scripts; Node still runs
# the node:test suites until the C7.3 migration.
bun = "1.4.5"
node = "26.13.1"
"npm:oxlint" = "1.93.0"

# The manifest verifier and the generator tests are Python; TypeScript cannot
# replace them without the C7.4 migration.
python = "3.12"

# Linters
"aqua:grafana/flint" = "0.22.14"

[env]
FLINT_CONFIG_DIR = ".github/config"
